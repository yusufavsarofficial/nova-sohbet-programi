databases:
  - name: kaplumbaga-db
    plan: free
    databaseName: kaplumbaga
    user: kaplumbaga

services:
  - type: web
    name: kaplumbaga-api
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: REGISTRATION_KEY
        value: "123456789"
      - key: REQUIRE_REGISTRATION_KEY
        value: "0"
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: kaplumbaga-db
          property: connectionString
